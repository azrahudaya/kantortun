<!-- kantortun nyala: dua mulut pipa yang tersambung garis tembus, plus titik
     paket di tengah. Motifnya "jalan terus", bukan glyph stok network-vpn,
     karena alatnya ssh -D bukan VPN. Catatan ini sengaja ditaruh SETELAH tag
     </svg>: gdk-pixbuf mencocokkan mime dari byte awal saja, dan kalau <svg
     jatuh di luar ~256 byte pertama ikonnya gagal dimuat lalu panel memakai
     ikon "gambar hilang". -->